version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["kochrisdev"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "npm"
    # The root package.json and package-lock.json own the npm workspace graph.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["kochrisdev"]
    commit-message:
      prefix: "chore(deps)"

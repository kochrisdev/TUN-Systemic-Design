name: TUN React checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: tun-react-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    name: React compatibility (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [locked, react-18.3.0, react-18.3.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Use pinned package manager
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Build and preserve the distributable with the committed default peers
        run: |
          npm ci --strict-peer-deps --no-fund --no-audit
          git diff --exit-code -- package-lock.json
          npm run build:library
          npm run test:package
          mkdir -p artifacts/canonical
          cp artifacts/tun-systemic-react-0.1.0.tgz artifacts/canonical/
          cp artifacts/package-check.json artifacts/canonical/
      - name: Prepare the isolated peer profile
        run: npm run compat:prepare -- ${{ matrix.profile }}
      - name: Install the selected dependency graph
        run: npm ci --strict-peer-deps --no-fund --no-audit
      - name: Verify actual peers and absence of nested React copies
        run: npm run compat:verify -- ${{ matrix.profile }}
      - name: Preserve the default committed graph
        if: matrix.profile == 'locked'
        run: git diff --exit-code -- package.json package-lock.json examples/react/package.json
      - name: Audit both dependency graphs (fail on any finding or audit error)
        run: python3 scripts/audit_dependencies.py
      - name: Validate existing design tokens
        run: python3 scripts/tokens.py check
      - name: Typecheck, contract tests, React tests, production build, and package checks
        run: npm run check
      - name: Install the default-peer-built archive into the selected peer consumer
        run: npm run test:consumer -- --canonical
      - name: Collect mapped requirement-test evidence
        run: python3 scripts/check_conformance.py --run
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and accessibility samples
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tun-react-check-artifacts-${{ matrix.profile }}
          path: |
            playwright-report/
            test-results/
            artifacts/
            examples/react/dist/
            package-lock.json
          retention-days: 7
  # Keep the exact required-check context; a skipped/cancelled matrix is NOT green.
  verify:
    if: ${{ always() }}
    needs: [compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every peer profile to succeed
        env:
          MATRIX_RESULT: ${{ needs.compatibility.result }}
        run: test "$MATRIX_RESULT" = "success"

name: TUN React checks
on:
  push:
    paths: ['packages/react/**', 'examples/react/**', 'tests/**', 'styles/**', 'tokens/**', 'scripts/**', 'package*.json', '*config*.json', '*config*.ts', '.github/workflows/react.yml']
  pull_request:
    paths: ['packages/react/**', 'examples/react/**', 'tests/**', 'styles/**', 'tokens/**', 'scripts/**', 'package*.json', '*config*.json', '*config*.ts', '.github/workflows/react.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tun-react-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Use pinned package manager
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-fund; fi
      - name: Validate existing design tokens
        run: python3 scripts/tokens.py check
      - name: Typecheck, contract tests, React tests, and production build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and accessibility samples
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tun-react-check-artifacts
          path: |
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 7

name: TUN React checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: tun-react-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Use pinned package manager
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Install the committed dependency graph
        run: |
          npm ci --no-fund --no-audit
          git diff --exit-code -- package-lock.json
      - name: Audit both dependency graphs (fail on any finding or audit error)
        run: python3 scripts/audit_dependencies.py
      - name: Validate existing design tokens
        run: python3 scripts/tokens.py check
      - name: Typecheck, contract tests, React tests, production build, and package checks
        run: npm run check
      - name: Collect mapped requirement-test evidence
        run: python3 scripts/check_conformance.py --run
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and accessibility samples
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tun-react-check-artifacts
          path: |
            playwright-report/
            test-results/
            artifacts/
            examples/react/dist/
            package-lock.json
          retention-days: 7

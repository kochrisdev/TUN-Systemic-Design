name: Prepare runtime-contract development inputs
on:
  pull_request:
    paths: ['.github/workflows/contracts-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/runtime-contracts-v0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve the new workspace dependency only
        run: |
          npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
          mkdir -p preparation
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp package-lock.json preparation/package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm pack npm@12.1.0 --ignore-scripts --json --pack-destination preparation > preparation/npm-pack.json
          tar -czf preparation/development-dependencies.tar.gz node_modules
          cd contracts/consumers/go
          go mod tidy
          cp go.mod go.sum ../../../preparation/
          go list -m all > ../../../preparation/go-versions.txt
          tar -czf ../../../preparation/go-modules.tar.gz -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-lock-inputs
          path: preparation/
          retention-days: 1

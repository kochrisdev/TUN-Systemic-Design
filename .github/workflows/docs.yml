name: TUN documentation checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tun-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check documentation links and fences
        run: python3 scripts/check_docs.py
      - name: Test the documentation checker
        run: python3 -m unittest discover -s tests -p 'test_docs.py' -v
      - name: Check requirement traceability
        run: python3 scripts/check_conformance.py
      - name: Test requirement traceability and evidence collection
        run: python3 -m unittest discover -s tests -p 'test_conformance.py' -v
      - name: Test dependency audit failure policy and security configuration
        run: python3 -m unittest discover -s tests -p 'test_security.py' -v
      - name: Check component and threat conformance relations
        run: python3 scripts/conformance.py check
      - name: Test component and threat conformance relations
        run: python3 -m unittest discover -s tests -p 'test_conformance_relations.py' -v

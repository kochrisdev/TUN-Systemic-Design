# Temporary dependency bootstrap; remove before merging this branch.
# Creates only an unattached Git blob. It never changes a branch or commit.
name: TUN dependency snapshot
on:
  push:
    branches: ['feat/react-components-v0.1']
    paths: ['package.json', '.github/workflows/dependency-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'kochrisdev/TUN-Systemic-Design'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Use pinned package manager
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Resolve dependency metadata without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Audit all dependencies and runtime dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-audit.json
          full_status=$?
          npm audit --omit=dev --json > dependency-audit-runtime.json
          runtime_status=$?
          set -e
          cat dependency-audit.json
          cat dependency-audit-runtime.json
          if [ "$full_status" -gt 1 ] || [ "$runtime_status" -gt 1 ]; then exit 1; fi
      - name: Store reviewed candidate as an unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          raw = pathlib.Path('package-lock.json').read_bytes()
          lock = json.loads(raw)
          assert lock['lockfileVersion'] == 3
          for name, item in lock['packages'].items():
              if item.get('link'):
                  assert item['resolved'] in ('packages/react', 'examples/react')
              elif 'resolved' in item:
                  assert item['resolved'].startswith('https://registry.npmjs.org/'), name
                  assert item.get('integrity', '').startswith('sha512-'), name
          body = json.dumps({'content': raw.decode('utf-8'), 'encoding': 'utf-8'}).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/kochrisdev/TUN-Systemic-Design/git/blobs',
              data=body,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json',
                       'X-GitHub-Api-Version': '2022-11-28'},
              method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert result['sha'] == expected
          print('LOCK_BLOB_SHA=' + result['sha'])
          print('LOCK_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('SOURCE_COMMIT=' + os.environ['GITHUB_SHA'])
          print('LOCK_BYTES=' + str(len(raw)))
          for name in ('vitest', '@vitest/mocker', 'vite', 'react', '@playwright/test'):
              print(name + '=' + lock['packages']['node_modules/' + name]['version'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tun-dependency-snapshot
          path: |
            package-lock.json
            dependency-audit.json
            dependency-audit-runtime.json
          retention-days: 7
